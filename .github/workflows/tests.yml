name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all exercise tests
        # Don't fail yet — we want the README updated with results either way.
        run: npx jest --json --outputFile=results.json || true

      - name: Update README with test results
        run: node tools/update-readme.js results.json

      - name: Commit updated README
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || { git commit -m "docs: update test results [skip ci]"; git push; }

      - name: Fail the job if any tests failed
        run: node -e "process.exit(require('./results.json').success ? 0 : 1)"
